<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grabador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="logo"><span></span></span>
        grabador
      </div>
      <div class="win">
        <button id="mcp" class="icon" title="Copiar comando para conectar agentes (MCP)">
          <svg viewBox="0 0 16 16"><path d="M6 2v3M10 2v3M4.5 5h7v3a3.5 3.5 0 01-7 0zM8 11.5V14"/></svg>
        </button>
        <button id="pin" class="icon" title="Siempre visible">
          <svg viewBox="0 0 16 16"><path d="M10 2l4 4-2.5 1-2 2 .5 3-1 1-3-3-3.5 3.5M5 7l3-3 1-1"/></svg>
        </button>
        <button id="min" class="icon" title="Minimizar">
          <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
        </button>
        <button id="close" class="icon close" title="Cerrar">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div id="screen" class="screen">
        <img id="preview" alt="">
        <div class="screen-top">
          <span id="chip" class="chip"><i></i><b>Listo</b></span>
          <span id="res" class="tag"></span>
        </div>
        <div class="screen-bottom">
          <div id="timer" class="timer">00:00:00</div>
        </div>
      </div>
      <div id="meta" class="meta">—</div>
      <div class="beam"></div>
    </section>

    <section class="actions">
      <button id="rec" class="primary">
        <span class="glyph"></span><span id="recText">Grabar</span>
      </button>
      <div class="split">
        <button id="shot" class="ghost">
          <svg viewBox="0 0 16 16"><path d="M2 5.5h2.5L6 3.5h4l1.5 2H14v7H2z"/><circle cx="8" cy="9" r="2.2"/></svg>
          Captura
        </button>
        <button id="folder" class="ghost">
          <svg viewBox="0 0 16 16"><path d="M2 4h4l1.5 1.5H14V12.5H2z"/></svg>
          Carpeta
        </button>
      </div>
    </section>

    <section id="settings" class="bento">
      <div class="cells">
        <div class="cell">
          <span class="label">FPS</span>
          <div class="seg" data-key="fps">
            <button data-v="30">30</button><button data-v="60">60</button>
          </div>
        </div>
        <div class="cell">
          <span class="label">Calidad</span>
          <div class="seg" data-key="quality">
            <button data-v="maxima">Máx</button><button data-v="alta">Ligera</button>
          </div>
        </div>
        <div id="monitorCell" class="cell hidden">
          <span class="label">Monitor</span>
          <div id="monitors" class="seg" data-key="monitor"></div>
        </div>
      </div>
      <div class="cells">
        <label class="cell">
          <span class="label">Sistema</span>
          <select id="sys"></select>
        </label>
        <label class="cell">
          <span class="label">Micrófono</span>
          <select id="mic"></select>
        </label>
      </div>
    </section>

    <section class="last">
      <span class="label">Última</span>
      <button id="last" class="lastfile" title="Clic: reproducir · Clic derecho: mostrar en carpeta" disabled>
        <span class="name">—</span><span class="size"></span>
      </button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
